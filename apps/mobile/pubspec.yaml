name: casamento
description: "App de gestão de casamento — Ludmila & Dyego."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^17.3.0
  google_fonts: ^8.2.0
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  intl: 0.20.2
  provider: ^6.1.5+1
  uuid: ^4.6.0
  http: ^1.4.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/logo_ludmila_dyego.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/logo_ludmila_dyego.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo_ludmila_dyego.png
