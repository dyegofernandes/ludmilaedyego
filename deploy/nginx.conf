server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ludmilaedyego.ddns.net ludmilaedyego ludmilaedyego.com
                www.ludmilaedyego.com ludmilaedyego.com.br
                www.ludmilaedyego.com.br localhost _;

    client_max_body_size 32m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/health {
        proxy_pass http://api:3000/api/health;
    }

    location / {
        return 301 https://$host:8087$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ludmilaedyego.ddns.net ludmilaedyego ludmilaedyego.com
                www.ludmilaedyego.com ludmilaedyego.com.br
                www.ludmilaedyego.com.br localhost _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 32m;
    client_body_timeout 120s;

    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering off;
    }

    location /uploads/ {
        proxy_pass http://api:3000/uploads/;
        proxy_set_header Host $host;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
