# No servidor (porta 80): o Docker do casamento já publica 80.
# Use este arquivo só se o nginx do HOST for quem escuta a porta 80
# (copie para /etc/nginx/sites-enabled/ludmilaedyego.conf e recarregue).
#
# DNS: registro A de ludmilaedyego.com → 207.180.243.108
# Neste computador: 207.180.243.108 ludmilaedyego

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ludmilaedyego ludmilaedyego.com www.ludmilaedyego.com
                ludmilaedyego.com.br www.ludmilaedyego.com.br _;

    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:8087;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
