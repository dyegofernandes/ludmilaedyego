# Nginx do HOST (porta 80 já ocupada no VPS).
# Copie para sites-enabled e recarregue:
#   sudo cp deploy/host-nginx-ludmilaedyego.conf /etc/nginx/sites-enabled/ludmilaedyego.ddns.net.conf
#   sudo mkdir -p /var/www/certbot
#   sudo nginx -t && sudo systemctl reload nginx
#
# Let's Encrypt valida HTTP-01 nesta porta 80.
# O site público fica em https://ludmilaedyego.ddns.net:8087/

server {
    listen 80;
    listen [::]:80;
    server_name ludmilaedyego.ddns.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://ludmilaedyego.ddns.net:8087$request_uri;
    }
}
